name: Runtime Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: ${{ vars.RUNTIME_LOCK }}
  cancel-in-progress: false

jobs:
  run-worker-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out runner helpers
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify state backup helpers
        run: python -m unittest discover -s tests -v

      - name: Start Runtime Service
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          RUNTIME_SOURCES: ${{ secrets.RUNTIME_SOURCES }}
          PYTHONUTF8: "1"
          QUIET_STARTUP: "1"
        run: |
          git config --global user.name "Runtime Sync"
          git config --global user.email "runtime@users.noreply.github.com"
          python "$GITHUB_WORKSPACE/checkout_sources.py" worker

          pip install --upgrade pip
          pip install -r worker/requirements.txt

          cp -a "worker" "$RUNNER_TEMP/worker_state_sync"

          save_worker_state() {
            local failed=0
            for d in worker; do
              if ! python "$GITHUB_WORKSPACE/runtime_state.py" "$d" "$RUNNER_TEMP/${d}_state_sync" 'shop_data.db' 'canboso_cache.json' 'roboticvn_cache.json' 'thomap_userbot.session' 'auto_ads_config.json' 'ads_userbot.session' 'auto_ads_media.*'; then
                failed=1
              fi
            done
            return "$failed"
          }

          (
            while true; do
              sleep 180
              if ! save_worker_state; then
                echo "::warning::Periodic state save failed; next cycle will retry."
              fi
            done
          ) &
          AUTOSAVE_PID=$!

          (
            cd worker
            while true; do
              git fetch origin main 2>/dev/null || true
              if ! grep -qE '^BOT_TOKEN=.+$' .env 2>/dev/null; then
                git checkout origin/main -- .env 2>/dev/null || true
              fi
              git checkout origin/main -- hub_tunnel.json 2>/dev/null || true
              if grep -qE '^BOT_TOKEN=.+$' .env 2>/dev/null; then
                sleep 45
              else
                sleep 15
              fi
            done
          ) &
          HOTSYNC_PID=$!

          (
            cd worker
            START_TIME=$SECONDS
            while [ $((SECONDS - START_TIME)) -lt 19500 ]; do
              REMAINING=$((19500 - (SECONDS - START_TIME)))
              if [ $REMAINING -le 0 ]; then break; fi
              timeout --signal=SIGINT --kill-after=30s ${REMAINING}s python -X utf8 userbot_hub.py >>/tmp/runtime.log 2>&1 || true
              sleep 3
            done
          ) &

          sleep 2

          (
            cd worker
            START_TIME=$SECONDS
            while [ $((SECONDS - START_TIME)) -lt 19500 ]; do
              if ! grep -qE '^BOT_TOKEN=.+$' .env 2>/dev/null; then
                sleep 5
                continue
              fi
              REMAINING=$((19500 - (SECONDS - START_TIME)))
              if [ $REMAINING -le 0 ]; then break; fi
              timeout --signal=SIGINT --kill-after=30s ${REMAINING}s python -X utf8 bot.py >>/tmp/runtime.log 2>&1 || true
              sleep 3
            done
          ) &

          sleep 19505

          kill "$AUTOSAVE_PID" "$HOTSYNC_PID" 2>/dev/null || true
          wait "$AUTOSAVE_PID" 2>/dev/null || true

          if ! save_worker_state; then
            echo "::warning::End-of-run state save failed; finalizer will retry."
          fi

          curl --fail --silent --show-error --location --max-time 30 -X POST \
            -H "Authorization: token ${PAT_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/run-service.yml/dispatches" \
            -d '{"ref":"main"}' || true

      - name: Save validated state on exit or cancel
        if: always()
        run: |
          pkill -INT -f "python -X utf8" 2>/dev/null || true
          sleep 3
          failed=0
          for d in worker; do
            if [ -d "$d/.git" ]; then
              if [ ! -d "$RUNNER_TEMP/${d}_state_sync/.git" ]; then
                echo "::error::Independent state checkout is missing."
                failed=1
                continue
              fi
              if ! python "$GITHUB_WORKSPACE/runtime_state.py" "$d" "$RUNNER_TEMP/${d}_state_sync" 'shop_data.db' 'canboso_cache.json' 'roboticvn_cache.json' 'thomap_userbot.session' 'auto_ads_config.json' 'ads_userbot.session' 'auto_ads_media.*'; then
                failed=1
              fi
            fi
          done
          exit "$failed"
