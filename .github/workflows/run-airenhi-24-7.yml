name: AI Re Nhi Dedicated 24/7 Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: airenhi-dedicated-24-7-single-instance
  cancel-in-progress: false

jobs:
  run-airenhi-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone & Start AI Re Nhi (@airenhibot) on Dedicated Server 24/7
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          PYTHONUTF8: "1"
          QUIET_STARTUP: "1"
        run: |
          git config --global user.name "Airenhi AutoSave"
          git config --global user.email "airenhi@users.noreply.github.com"

          git clone https://x-access-token:${PAT_TOKEN}@github.com/alexandratodika/airenhi-tele-shop-bot.git airenhi
          pip install --upgrade pip
          pip install -r airenhi/requirements.txt

          save_airenhi_state() {
            (
              cd airenhi
              python -c "import os, sqlite3; [(c := sqlite3.connect(f, timeout=15), c.execute('PRAGMA wal_checkpoint(TRUNCATE)'), c.close()) for f in ('shop_data.db',) if os.path.exists(f)]" 2>/dev/null || true
              shopt -s nullglob
              for f in shop_data.db canboso_cache.json roboticvn_cache.json thomap_userbot.session auto_ads_config.json ads_userbot.session auto_ads_media.*; do
                if [ -f "$f" ]; then
                  git add -f "$f" 2>/dev/null || true
                fi
              done
              if ! git diff --cached --quiet; then
                git commit -m "chore: auto-save airenhi db & cache [skip ci]" || true
                if ! git pull --rebase -X ours origin main; then
                  git rebase --abort 2>/dev/null || true
                  git fetch origin main || true
                  git reset origin/main || true
                  for f in shop_data.db canboso_cache.json roboticvn_cache.json thomap_userbot.session auto_ads_config.json ads_userbot.session auto_ads_media.*; do
                    if [ -f "$f" ]; then git add -f "$f" 2>/dev/null || true; fi
                  done
                  git commit -m "chore: auto-save airenhi db & cache [skip ci]" || true
                fi
                git push origin main || true
              fi
            )
          }

          # Auto-save database & synced catalog cache every 180 seconds
          (
            while true; do
              sleep 180
              save_airenhi_state
            done
          ) &
          AUTOSAVE_PID=$!

          # Hot-sync .env every 15 seconds while BOT_TOKEN is not yet filled, and refresh hub_tunnel.json periodically
          (
            cd airenhi
            while true; do
              git fetch origin main 2>/dev/null || true
              if ! grep -qE '^BOT_TOKEN=.+$' .env 2>/dev/null; then
                git checkout origin/main -- .env 2>/dev/null || true
              fi
              git checkout origin/main -- hub_tunnel.json 2>/dev/null || true
              if grep -qE '^BOT_TOKEN=.+$' .env 2>/dev/null; then
                sleep 45
              else
                sleep 15
              fi
            done
          ) &
          HOTSYNC_PID=$!

          # Launch local Userbot Hub on dedicated server (idle unless Admin connects a dedicated userbot here)
          (
            cd airenhi
            START_TIME=$SECONDS
            while [ $((SECONDS - START_TIME)) -lt 19500 ]; do
              REMAINING=$((19500 - (SECONDS - START_TIME)))
              if [ $REMAINING -le 0 ]; then break; fi
              timeout --signal=SIGINT ${REMAINING}s python -X utf8 userbot_hub.py || true
              sleep 3
            done
          ) &

          sleep 2

          # Launch @airenhibot 24/7 supervisor (waits cleanly if BOT_TOKEN is empty, starts instantly once hot-synced!)
          (
            cd airenhi
            START_TIME=$SECONDS
            while [ $((SECONDS - START_TIME)) -lt 19500 ]; do
              if ! grep -qE '^BOT_TOKEN=.+$' .env 2>/dev/null; then
                sleep 5
                continue
              fi
              REMAINING=$((19500 - (SECONDS - START_TIME)))
              if [ $REMAINING -le 0 ]; then break; fi
              timeout --signal=SIGINT ${REMAINING}s python -X utf8 bot.py || true
              sleep 3
            done
          ) &

          sleep 19505

          kill "$AUTOSAVE_PID" "$HOTSYNC_PID" 2>/dev/null || true
          wait "$AUTOSAVE_PID" 2>/dev/null || true

          save_airenhi_state

          curl -s -X POST \
            -H "Authorization: token ${PAT_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/alexandratodika/airenhi-cloud-runner/actions/workflows/run-airenhi-24-7.yml/dispatches \
            -d '{"ref":"main"}' || true

      - name: Final Zero-Loss DB & Session Save (On Exit or Cancel)
        if: always()
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          pkill -INT -f "python -X utf8" 2>/dev/null || true
          sleep 2
          if [ -d "airenhi/.git" ]; then
            (
              cd airenhi
              python -c "import os, sqlite3; [(c := sqlite3.connect(f, timeout=15), c.execute('PRAGMA wal_checkpoint(TRUNCATE)'), c.close()) for f in ('shop_data.db',) if os.path.exists(f)]" 2>/dev/null || true
              shopt -s nullglob
              for f in shop_data.db canboso_cache.json roboticvn_cache.json thomap_userbot.session auto_ads_config.json ads_userbot.session auto_ads_media.*; do
                if [ -f "$f" ]; then
                  git add -f "$f" 2>/dev/null || true
                fi
              done
              if ! git diff --cached --quiet; then
                git commit -m "chore: final zero-loss save airenhi db & cache [skip ci]" || true
                if ! git pull --rebase -X ours origin main; then
                  git rebase --abort 2>/dev/null || true
                  git fetch origin main || true
                  git reset origin/main || true
                  for f in shop_data.db canboso_cache.json roboticvn_cache.json thomap_userbot.session auto_ads_config.json ads_userbot.session auto_ads_media.*; do
                    if [ -f "$f" ]; then git add -f "$f" 2>/dev/null || true; fi
                  done
                  git commit -m "chore: final zero-loss save airenhi db & cache [skip ci]" || true
                fi
                git push origin main || true
              fi
            )
          fi
